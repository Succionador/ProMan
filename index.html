<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>范工管理 - 在线答题系统</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 50px;
    }

    .header .icon {
      font-size: 60px;
      margin-bottom: 10px;
    }

    .header h1 {
      font-size: 2.4rem;
      color: #fff;
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .header p {
      color: rgba(255,255,255,0.8);
      font-size: 1.1rem;
      margin-top: 10px;
    }

    .chapters {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .chapter-card {
      background: rgba(255,255,255,0.95);
      border-radius: 16px;
      padding: 28px 24px;
      text-decoration: none;
      color: #333;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .chapter-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #b21f1f, #fdbb2d);
      transform: scaleX(0);
      transition: transform 0.3s ease;
    }

    .chapter-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    }

    .chapter-card:hover::before {
      transform: scaleX(1);
    }

    .chapter-num {
      font-size: 0.85rem;
      font-weight: 600;
      color: #b21f1f;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .chapter-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #1a2a6c;
      line-height: 1.5;
    }

    .chapter-arrow {
      position: absolute;
      bottom: 20px;
      right: 20px;
      font-size: 1.2rem;
      color: #ccc;
      transition: color 0.3s ease;
    }

    .chapter-card:hover .chapter-arrow {
      color: #b21f1f;
    }

    .footer {
      text-align: center;
      margin-top: 60px;
      color: rgba(255,255,255,0.6);
      font-size: 0.85rem;
    }

    .footer a {
      color: rgba(255,255,255,0.8);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 1.8rem;
      }
      .chapters {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
